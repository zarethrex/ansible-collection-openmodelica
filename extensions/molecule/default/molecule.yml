---
driver:
  name: podman
platforms:
  - name: centos-stream-10
    groups:
      - openmodelica_nodes
    image: quay.io/centos/centos:stream10-development
  - name: debian-trixie
    groups:
      - openmodelica_nodes
    image: debian:trixie
  - name: fedora-44
    groups:
      - openmodelica_nodes
    image: fedora:44
provisioner:
  name: ansible
  inventory:
    centos-stream-10:
      ansible_connection: containers.podman.podman
    debian-trixie:
      ansible_connection: containers.podman.podman
verifier:
  name: ansible
scenario:
  test_sequence:
    - destroy
    - create
    - prepare
    - converge
    - idempotence
    - syntax
    - destroy
