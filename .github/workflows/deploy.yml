name: Deploy to Ansible Galaxy
on:
  push:
    tags:
      - '^v[0-9]+\.[0-9]+\.[0-9]+$'
jobs:
  build:
    name: Build Collection 🛠️
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Setup UV
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
      - name: Set clean version
        id: vars
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
      - name: Build Collection
        run: |
          uv venv
          uv pip install -r requirements
          uv run ansible-galaxy collection build
      - name: Store the distribution packages
        uses: actions/upload-artifact@v7
        with:
          retention-days: 1
          if-no-files-found: error
          name: ansible-package-distributions
          path: zarethrex-openmodelica-${{ steps.vars.outputs.version }}.tar.gz
  publish:
    name: Publish to Ansible Galaxy 📦
    needs:
      - build
    runs-on: ubuntu-latest
    environment: ansible-galaxy
    permissions:
      id-token: write
    steps:
      - name: Setup UV
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
      - name: Set clean version
        id: vars
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
      - name: Download Package
        uses: actions/download-artifact@v8
        with:
          name: ansible-package-distributions
          path: zarethrex-openmodelica-${{ steps.vars.outputs.version }}.tar.gz
      - name: Publish to Ansible Galaxy
        run: |
          uv venv
          uv pip install -r requirements
          uv run ansible-galaxy collection publish zarethrex-openmodelica-${{ steps.vars.outputs.version }}.tar.gz --token ${{ secrets.ANSIBLE_GALAXY_SERVER_TOKEN }}
  github-release:
    name: Create Signed GitHub Release 🔏
    runs-on: ubuntu-latest
    needs:
      - publish
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Set clean version
        id: vars
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Download all the dists
        uses: actions/download-artifact@v8
        with:
          name: ansible-package-distributions
          path: zarethrex-openmodelica-${{ steps.vars.outputs.version }}.tar.gz
      - name: Sign the dists with Sigstore
        uses: sigstore/gh-action-sigstore-python@v3.0.0
        with:
          inputs: >-
            zarethrex-openmodelica-${{ steps.vars.outputs.version }}.tar.gz
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          LATESTCHANGES=$(awk '
            BEGIN { header_found = 0 }
            /^## / {
                if (header_found == 0) {
                    header = $0
                    header_found = 1
                    next
                } else {
                  exit
                }
            }
            header_found == 1 && /^\- / { print }
          ' CHANGELOG.md) gh release create '${{ github.ref_name }}' --notes
          "$LATESTCHANGES" --title 'zarethrex-openmodelica/${{ github.ref_name }}' --repo '${{
          github.repository }}'
      - name: Upload artifact signatures to GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          gh release upload '${{ github.ref_name }}' zarethrex-openmodelica-${{ steps.vars.outputs.version }}.tar.gz --repo '${{ github.repository }}'
