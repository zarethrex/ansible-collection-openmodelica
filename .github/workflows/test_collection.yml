name: Test Ansible Collection
on:
  push:
    branches:
      - main
  pull_request: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linting:
    runs-on: ubuntu-latest
    name: Ansible Lint
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Setup UV
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
      - name: Run Ansible Lint
        run: |
          uv venv
          uv pip install -r requirements.txt
          uv run ansible-lint
  test_collection:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        system:
          - platform: debian-trixie
            label: Debian 13
          - platform: centos-stream-10
            label: Centos 10
          - platform: fedora-44
            label: Fedora 44
    name: Test zarethrex.openmodelica (${{ matrix.system.label }})
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Install Podman
        uses: redhat-actions/podman-install@v1
      - name: Setup UV
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          python-version: "3.14"
      - name: Install Ansible
        run: |
          uv venv
          uv pip install -r requirements.txt
      - name: Test Collection with Molecule
        run: uv run molecule test -- --limit localhost:${{ matrix.system.platform }}
