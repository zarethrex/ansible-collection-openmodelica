---
argument_specs:
  main:
    author: Kristian Zarebski
    short_description: main entry point for OpenModelica install
    description:
      - Installs the latest OpenModelica version on the system
      - Also allows user to specify OM packages to install
    options:
      openmodelica_install_graphical_clients:
        type: bool
        default: true
        description: whether to install the graphical applications
      openmodelica_install_cpp_runtime:
        type: bool
        default: false
        description: whether to install the alternative C++ runtime
