---
- name: Install Pre-requisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true
- name: Retrieve OpenModelica GPG Key
  ansible.builtin.get_url:
    url: "{{ openmodelica_apt_key_url }}"
    dest: /tmp/openmodelica.asc
    mode: "0644"
- name: Write Key to System
  ansible.builtin.command:
    cmd: "gpg --dearmor -o {{ openmodelica_gpg_key_file }} /tmp/openmodelica.asc"
    creates: "{{ openmodelica_gpg_key_file }}"
- name: Update APT Sources
  block:
    - name: Determine if APT supports DEB822 (APT >= 2.4)
      ansible.builtin.command:
        cmd: apt --version
      register: apt_version_cmd
      changed_when: false
    - name: Read APT Version
      ansible.builtin.set_fact:
        apt_version: "{{ apt_version_cmd.stdout | regex_search('[0-9]+\\.[0-9]+\\.[0-9]+') }}"
    - name: Add OpenModelica Repository (DEB822)
      when: apt_version is ansible.builtin.version('2.4', '>=')
      ansible.builtin.copy:
        content: |
          Types: deb
          URIs: {{ openmodelica_repo_url }}
          Suites: {{ ansible_lsb.codename | default('stable') }}
          Components: stable
          Signed-By: {{ openmodelica_gpg_key_file }}
          Architectures: amd64
        dest: /etc/apt/sources.list.d/openmodelica.sources
        mode: "0644"
    - name: Add OpenModelica Repository (Legacy)
      when: apt_version is not ansible.builtin.version('2.4', '>=')
      ansible.builtin.apt_repository:
        repo: >
          deb [arch=amd64 signed-by={{ openmodelica_gpg_key_file }}]
          {{ openmodelica_repo_url }} {{ ansible_lsb.codename | default('stable') }} stable
        filename: openmodelica
        state: present
- name: Install OpenModelica
  block:
    - name: Install OMC Only
      when: not openmodelica_install_graphical_clients
      ansible.builtin.apt:
        name: omc
        state: present
        install_recommends: false
        update_cache: true
      register: install_omc
    - name: Install OpenModelica
      when: openmodelica_install_graphical_clients
      ansible.builtin.apt:
        name: openmodelica
        state: present
        update_cache: true
      register: install_om_full
    - name: Install C++ Runtime
      ansible.builtin.apt:
        name: libomccpp
        state: present
      when: openmodelica_install_cpp_runtime
