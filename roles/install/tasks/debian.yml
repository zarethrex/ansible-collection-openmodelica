---
- name: Install Pre-requisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - python3-debian
    state: present
    update_cache: true
- name: Retrieve OpenModelica GPG Key
  ansible.builtin.get_url:
    url: "{{ openmodelica_apt_key_url }}"
    dest: /tmp/openmodelica.asc
    mode: "0644"
- name: Write Key to System
  ansible.builtin.command:
    cmd: "gpg --dearmor -o {{ openmodelica_gpg_key_file }} /tmp/openmodelica.asc"
    creates: "{{ openmodelica_gpg_key_file }}"
- name: Add OpenModelica Repository
  ansible.builtin.deb822_repository:
    name: openmodelica
    types: [deb]
    uris: "https://build.openmodelica.org/apt"
    suites: "{{ ansible_facts.distribution_release }}"
    components: [stable]
    signed_by: "https://build.openmodelica.org/apt/openmodelica.asc"
    state: present
- name: Install OpenModelica
  block:
    - name: Install OMC Only
      when: not openmodelica_install_graphical_clients
      ansible.builtin.apt:
        name: omc
        state: present
        install_recommends: false
        update_cache: true
      register: install_omc
    - name: Install OpenModelica
      when: openmodelica_install_graphical_clients
      ansible.builtin.apt:
        name: openmodelica
        state: present
        update_cache: true
      register: install_om_full
    - name: Install C++ Runtime
      ansible.builtin.apt:
        name: libomccpp
        state: present
      when: openmodelica_install_cpp_runtime
